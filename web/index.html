<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TJ-VideoPrep</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">TJ-VideoPrep</span>
      <span class="brand-sub" id="app-version"></span>
    </div>
    <div class="topbar-actions">
      <button id="btn-env" class="btn ghost">运行环境</button>
      <button id="btn-open-dir" class="btn ghost">程序目录</button>
    </div>
  </header>

  <section id="envbar" class="envbar hidden">
    <div class="env-item"><label>ffmpeg</label><span id="env-ffmpeg" class="mono">检测中…</span></div>
    <div class="env-item"><label>ffprobe</label><span id="env-ffprobe" class="mono">检测中…</span></div>
    <div class="env-item"><label>mpv</label><span id="env-mpv" class="mono">检测中…</span></div>
    <div class="env-actions">
      <button id="btn-recheck" class="btn tiny accent">重新检测</button>
      <button id="btn-pick-ffmpeg" class="btn tiny">指定 ffmpeg</button>
      <button id="btn-pick-mpv" class="btn tiny">指定 mpv</button>
      <button id="btn-dl-mpv" class="btn tiny accent">下载 mpv</button>
      <button id="btn-mpv-page" class="btn tiny ghost">下载页</button>
    </div>
  </section>

  <div class="toolbar">
    <button id="btn-add-files" class="btn accent">添加文件</button>
    <button id="btn-add-folder" class="btn">添加文件夹</button>
    <button id="btn-clear" class="btn ghost">清空列表</button>
    <span class="drop-hint">也可以把视频或整个文件夹直接拖进窗口</span>
  </div>

  <div id="drop-overlay" class="drop-overlay hidden"><div class="drop-box">松开即可添加</div></div>

  <main class="layout">
    <section class="card col-queue">
      <div class="card-head">
        <h2>文件队列</h2>
        <span id="queue-count" class="hint">0 个</span>
      </div>
      <div id="queue" class="queue"></div>
      <div class="queue-foot">
        <label class="check"><input type="checkbox" id="opt-auto-first" checked /><span>多条音轨且未选择时，默认用第一条（会先提示）</span></label>
      </div>
    </section>

    <section class="col-main">
      <div class="card">
        <div class="card-head">
          <h2 id="current-name">未选择文件</h2>
          <span id="current-meta" class="hint"></span>
        </div>
        <div class="table-wrap">
          <table class="tracks">
            <thead>
              <tr>
                <th style="width:40px" title="选择用于导出的音轨">选</th>
                <th style="width:40px">#</th>
                <th>编码</th>
                <th style="width:118px">声道</th>
                <th style="width:64px">语言</th>
                <th>标题</th>
                <th style="width:132px">建议</th>
                <th style="width:64px"></th>
              </tr>
            </thead>
            <tbody id="track-rows">
              <tr class="empty"><td colspan="8">添加文件后在此列出音轨</td></tr>
            </tbody>
          </table>
        </div>
        <div id="align-info" class="align-info muted">等待分析…</div>
        <label class="check"><input type="checkbox" id="opt-align" checked /><span>导出音频时按上面的偏移自动补偿（保证音频 0 秒 = 视频 0 秒）</span></label>
      </div>

      <div class="card">
        <div class="card-head"><h2>输出内容</h2></div>

        <div class="group">
          <label class="check"><input type="checkbox" id="opt-audio" checked /><span class="strong">音频</span></label>
          <div class="grid-2">
            <label class="field">格式
              <select id="opt-audio-codec">
                <option value="flac">FLAC（无损，推荐）</option>
                <option value="mp3">MP3（体积小）</option>
                <option value="wav">WAV（未压缩）</option>
              </select>
            </label>
            <label class="field">声道
              <select id="opt-audio-mode">
                <option value="stereo">2 声道 downmix（推荐）</option>
                <option value="native">保持源声道（原生多声道）</option>
                <option value="center">中置单声道（对白最干净）</option>
              </select>
            </label>
            <label class="field" id="field-bitrate">MP3 码率
              <select id="opt-audio-bitrate">
                <option value="320k">320 kbps</option>
                <option value="256k">256 kbps</option>
                <option value="192k">192 kbps</option>
              </select>
            </label>
          </div>
        </div>

        <div class="group">
          <label class="check"><input type="checkbox" id="opt-preview" checked /><span class="strong">视频 · 预览版</span></label>
          <p class="group-note">H.264 / mp4 / 短 GOP / 无音轨 / faststart，供打轴时看画面</p>
          <div class="grid-2">
            <label class="field">分辨率
              <select id="opt-preview-height">
                <option value="480">480p</option>
                <option value="720" selected>720p</option>
                <option value="1080">1080p</option>
              </select>
            </label>
            <label class="field">画质 CRF
              <input type="number" id="opt-preview-crf" value="30" min="1" max="51" />
            </label>
          </div>
        </div>

        <div class="group">
          <label class="check"><input type="checkbox" id="opt-high" /><span class="strong">视频 · 高质量版</span></label>
          <p class="group-note">原分辨率 H.264，画质更好、体积更大</p>
          <div class="grid-2">
            <label class="field">画质 CRF
              <input type="number" id="opt-high-crf" value="18" min="1" max="51" />
            </label>
          </div>
        </div>

        <div class="group">
          <label class="check"><input type="checkbox" id="opt-remux" /><span class="strong">原样封装（无损）</span></label>
          <p class="group-note">-c copy，不重新编码，速度最快、画质完全不变</p>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h2>输出位置</h2></div>
        <label class="check"><input type="radio" name="outmode" value="app" checked /><span>程序目录 · <span id="out-app-path" class="mono muted">…</span></span></label>
        <label class="check"><input type="radio" name="outmode" value="source" /><span>各源文件所在目录（各自建 <code>TJ-Output</code> 子文件夹）</span></label>
        <label class="check"><input type="radio" name="outmode" value="custom" /><span>指定目录</span></label>
        <div id="custom-dir-row" class="dir-line hidden">
          <span id="custom-dir" class="mono muted">未设置</span>
          <button id="btn-pick-custom" class="btn tiny">选择</button>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>将要执行</h2>
          <button id="btn-describe" class="btn tiny ghost">刷新命令预览</button>
        </div>
        <pre id="cmd-preview" class="cmd">选择音轨后可预览实际调用参数</pre>
      </div>

      <div class="card">
        <div class="actions">
          <button id="btn-start" class="btn accent big" disabled>开始输出</button>
          <button id="btn-cancel" class="btn big" disabled>取消</button>
          <button id="btn-open-out" class="btn ghost big">打开输出目录</button>
        </div>
        <div class="progress-wrap">
          <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
          <div class="progress-text mono" id="progress-text">就绪</div>
        </div>
        <pre id="log" class="log"></pre>
      </div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="modal-title">提示</h3>
      <div id="modal-body" class="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn">取消</button>
        <button id="modal-ok" class="btn accent">继续导出</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
